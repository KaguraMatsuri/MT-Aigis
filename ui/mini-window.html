<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; script-src 'self'">
  <title>MT-Aigis</title>
  <link rel="stylesheet" href="sidebar.css">
  <script src="mini-window.js" defer></script>
</head>
<body class="mini-window-page">
  <header id="chrome-bar">
    <div class="mini-window-controls volume-control">
      <button id="mini-reveal" class="titlebar-icon-button" type="button"
        aria-label="鼠标移动过来显示 移走隐藏" title="鼠标移动过来显示 移走隐藏" aria-pressed="true" disabled>
        <span class="titlebar-symbol" aria-hidden="true">◉</span>
      </button>
      <input id="mini-opacity" type="range" min="20" max="100" value="100" aria-label="透明度" title="透明度">
      <output id="mini-opacity-value" for="mini-opacity">100%</output>
    </div>
  </header>
  <div id="game-loading-surface" aria-hidden="true">
    <div class="game-loading-frame">
      <div class="game-loading-copy">
        <span>Now Loading</span>
        <span class="game-loading-dots"><span>.</span><span>.</span><span>.</span></span>
      </div>
      <span class="game-loading-brand">MT-Aigis</span>
    </div>
  </div>
</body>
</html>
